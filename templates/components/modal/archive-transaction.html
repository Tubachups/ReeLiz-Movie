<div class="modal fade" id="deleteTransactionModal" tabindex="-1" aria-labelledby="deleteTransactionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteTransactionModalLabel"><i class="fa-solid fa-box-archive me-2"></i>Confirm Archive</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to archive transaction <strong id="deleteTransId"></strong>?</p>
        <p class="text-muted small">This transaction will be moved to the Archive tab.</p>
        <input type="hidden" id="deleteTransactionId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteTransactionBtn">Archive</button>
      </div>
    </div>
  </div>
</div>
